name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository checks
        run: python3 scripts/validate_repo.py
      - name: Validate Phase 1 rules contract
        run: python3 scripts/validate_rules.py
